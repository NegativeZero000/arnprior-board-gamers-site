<!doctype html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="/css/core.css" />
        <link rel="stylesheet" href="/css/styles.css" />

        <script src="/js/navigation.js" defer></script>
        <script src="/js/lightbox.js" defer></script>
        <script src="/js/darkmode.js" defer></script>
        <script src="/js/config.js" defer></script>
        <title>Arnprior Board Gamers</title>
    </head>
    <body>
        <header id="cs-navigation">
            <div class="cs-container">
                <!--Nav Logo-->
                <a href="index.html" class="cs-logo" aria-label="return to home page">
                    <img
                        src="src/assets/icons/abg_logo_w_text.svg"
                        alt=""
                        width="400"
                        height="100"
                        aria-hidden="true"
                        decoding="async"
                    />
                </a>
                <!--Navigation List-->
                <nav class="cs-nav" aria-label="main navigation">
                    <!--Mobile Nav Toggle-->
                    <button
                        class="cs-toggle"
                        id="mobile-menu-toggle"
                        aria-expanded="false"
                        aria-controls="cs-ul-wrapper"
                        aria-label="mobile menu toggle"
                        aria-haspopup="menu"
                    >
                        <span class="cs-box" aria-hidden="true">
                            <span class="cs-line cs-line1"></span>
                            <span class="cs-line cs-line2"></span>
                            <span class="cs-line cs-line3"></span>
                        </span>
                    </button>
                    <!-- We need a wrapper div so we can set a fixed height on the cs-ul in case the nav list gets too long from too many dropdowns being opened and needs to have an overflow scroll. This wrapper acts as the background so it can go the full height of the screen and not cut off any overflowing nav items while the cs-ul stops short of the bottom of the screen, which keeps all nav items in view no matter how mnay there are-->
                    <div class="cs-ul-wrapper" id="cs-ul-wrapper">
                        <ul class="cs-ul">
                            <li class="cs-li">
                                <a href="/index.html" class="cs-li-link cs-active" aria-current="page"> Home </a>
                            </li>
                            <li class="cs-li">
                                <a href="/gallery.html" class="cs-li-link"> Gallery </a>
                            </li>
                            <li class="cs-li">
                                <div class="cs-social">
                                    <a
                                        href="https://www.facebook.com/groups/986963238821247"
                                        class="cs-social-link"
                                        aria-label="Visit our Facebook page"
                                    >
                                        <img
                                            class="cs-social-icon"
                                            src="src/assets/icons/icons8-facebook.svg"
                                            alt=""
                                            width="30"
                                            height="30"
                                            aria-hidden="true"
                                            decoding="async"
                                        />
                                    </a>
                                    <a
                                        href="https://discord.gg/upMKNp8jcQ"
                                        class="cs-social-link"
                                        aria-label="Visit our Discord server"
                                    >
                                        <img
                                            class="cs-social-icon"
                                            src="src/assets/icons/icons8-discord.svg"
                                            alt=""
                                            width="30"
                                            height="30"
                                            aria-hidden="true"
                                            decoding="async"
                                        />
                                    </a>
                                    <a
                                        href="https://mailhide.io/e/9ATyLdcb"
                                        class="cs-social-link email-link"
                                        aria-label="Send us an email"
                                    >
                                        <img
                                            class="cs-social-icon"
                                            src="src/assets/icons/email.svg"
                                            alt=""
                                            width="30"
                                            height="30"
                                            aria-hidden="true"
                                            decoding="async"
                                        />
                                    </a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>
                <!--Dark Mode toggle, uncomment button code if you want to enable a dark mode toggle-->
                <button id="dark-mode-toggle" aria-label="dark mode toggle" aria-pressed="false">
                    <svg
                        class="cs-moon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 480 480"
                        style="enable-background: new 0 0 480 480"
                        xml:space="preserve"
                        aria-hidden="true"
                    >
                        <path
                            d="M459.782 347.328c-4.288-5.28-11.488-7.232-17.824-4.96-17.76 6.368-37.024 9.632-57.312 9.632-97.056 0-176-78.976-176-176 0-58.4 28.832-112.768 77.12-145.472 5.472-3.712 8.096-10.4 6.624-16.832S285.638 2.4 279.078 1.44C271.59.352 264.134 0 256.646 0c-132.352 0-240 107.648-240 240s107.648 240 240 240c84 0 160.416-42.688 204.352-114.176 3.552-5.792 3.04-13.184-1.216-18.496z"
                        />
                    </svg>
                    <img
                        class="cs-sun"
                        aria-hidden="true"
                        src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Icons%2Fsun.svg"
                        decoding="async"
                        alt=""
                        width="15"
                        height="15"
                    />
                </button>
            </div>
        </header>

        <!-- ============================================ -->
        <!--                   Footer                     -->
        <!-- ============================================ -->

        <footer id="cs-footer-1292">
            <div class="cs-container">
                <!-- Logo Group -->
                <div class="cs-logo-group">
                    <a aria-label="go back to home" class="cs-logo" href="/index.html">
                        <img
                            class="cs-logo-img"
                            aria-hidden="true"
                            loading="lazy"
                            decoding="async"
                            src="src/assets/icons/abg_logo_w_text.svg"
                            alt="logo"
                            width="240"
                            height="32"
                        />
                    </a>
                    <p class="cs-text">Come play board games with us.</p>
                    <a href="https://mailhide.io/e/9ATyLdcb" class="cs-link email-link">
                        <img
                            class="cs-link-icon"
                            aria-hidden="true"
                            loading="lazy"
                            decoding="async"
                            src="/src/assets/icons/email.svg"
                            alt="icon"
                            width="24"
                            height="24"
                        />
                        a.....@dragonpower.ca
                    </a>
                </div>
                <!-- Links -->
                <ul class="cs-nav">
                    <li class="cs-nav-li">
                        <span class="cs-header">Site Map</span>
                    </li>
                    <li class="cs-nav-li">
                        <a class="cs-nav-link" href="/index.html">Home</a>
                    </li>
                    <li class="cs-nav-li">
                        <a class="cs-nav-link" href="/gallery.html">Gallery</a>
                    </li>
                </ul>
                <ul class="cs-nav">
                    <li class="cs-nav-li">
                        <span class="cs-header">Contact</span>
                    </li>
                    <li class="cs-nav-li">
                        <a class="cs-nav-link" href="https://www.facebook.com/groups/986963238821247">Facebook</a>
                    </li>
                    <li class="cs-nav-li">
                        <a class="cs-nav-link" href="https://discord.gg/upMKNp8jcQ">Discord</a>
                    </li>
                    <li class="cs-nav-li">
                        <a class="cs-nav-link email-link" href="https://mailhide.io/e/9ATyLdcb">Email</a>
                    </li>
                </ul>
            </div>
            <div class="cs-bottom">
                <span class="cs-copyright">Copyright &copy; 2026 All Right Reserved. </span>
            </div>
            <!--Floating Cirlces-->
            <div class="cs-floater" aria-hidden="true"></div>
        </footer>
    </body>
</html>
