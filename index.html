<!doctype html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="/css/core.css" />
        <link rel="stylesheet" href="/css/styles.css" />
        <link rel="stylesheet" href="/css/hero.css" />
        <script src="/js/navigation.js" defer></script>
        <script src="/js/darkmode.js" defer></script>
        <script src="/js/config.js" defer></script>
        <title>Arnprior Board Gamers</title>
    </head>
    <body>
        <header id="cs-navigation">
            <div class="cs-container">
                <!--Nav Logo-->
                <a href="index.html" class="cs-logo" aria-label="return to home page">
                    <img
                        src="src/assets/icons/abg_logo_w_text.svg"
                        alt=""
                        width="400"
                        height="100"
                        aria-hidden="true"
                        decoding="async"
                    />
                </a>
                <!--Navigation List-->
                <nav class="cs-nav" aria-label="main navigation">
                    <!--Mobile Nav Toggle-->
                    <button
                        class="cs-toggle"
                        id="mobile-menu-toggle"
                        aria-expanded="false"
                        aria-controls="cs-ul-wrapper"
                        aria-label="mobile menu toggle"
                        aria-haspopup="menu"
                    >
                        <span class="cs-box" aria-hidden="true">
                            <span class="cs-line cs-line1"></span>
                            <span class="cs-line cs-line2"></span>
                            <span class="cs-line cs-line3"></span>
                        </span>
                    </button>
                    <!-- We need a wrapper div so we can set a fixed height on the cs-ul in case the nav list gets too long from too many dropdowns being opened and needs to have an overflow scroll. This wrapper acts as the background so it can go the full height of the screen and not cut off any overflowing nav items while the cs-ul stops short of the bottom of the screen, which keeps all nav items in view no matter how mnay there are-->
                    <div class="cs-ul-wrapper" id="cs-ul-wrapper">
                        <ul class="cs-ul">
                            <li class="cs-li">
                                <a href="/index.html" class="cs-li-link cs-active" aria-current="page"> Home </a>
                            </li>
                            <li class="cs-li">
                                <a href="/about.html" class="cs-li-link"> About Us </a>
                            </li>
                            <li class="cs-li">
                                <a href="/about.html" class="cs-li-link"> Gallery </a>
                            </li>
                        </ul>
                    </div>
                </nav>
                <div class="cs-contact-group">
                    <div class="cs-social">
                        <a href="https://www.facebook.com/groups/986963238821247" class="cs-social-link" aria-label="Visit our Facebook page">
                            <img
                                class="cs-social-icon"
                                src="src\assets\icons\icons8-facebook.svg"
                                alt=""
                                width="30"
                                height="30"
                                aria-hidden="true"
                                decoding="async"
                            />
                        </a>
                        <a href="https://discord.gg/upMKNp8jcQ" class="cs-social-link" aria-label="Visit our Discord server">
                            <img
                                class="cs-social-icon"
                                src="src\assets\icons\icons8-discord.svg"
                                alt=""
                                width="30"
                                height="30"
                                aria-hidden="true"
                                decoding="async"
                            />
                        </a>
                    </div>
                </div>
                <!--Dark Mode toggle, uncomment button code if you want to enable a dark mode toggle-->
                <button id="dark-mode-toggle" aria-label="dark mode toggle" aria-pressed="false">
                    <svg
                        class="cs-moon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 480 480"
                        style="enable-background: new 0 0 480 480"
                        xml:space="preserve"
                        aria-hidden="true"
                    >
                        <path
                            d="M459.782 347.328c-4.288-5.28-11.488-7.232-17.824-4.96-17.76 6.368-37.024 9.632-57.312 9.632-97.056 0-176-78.976-176-176 0-58.4 28.832-112.768 77.12-145.472 5.472-3.712 8.096-10.4 6.624-16.832S285.638 2.4 279.078 1.44C271.59.352 264.134 0 256.646 0c-132.352 0-240 107.648-240 240s107.648 240 240 240c84 0 160.416-42.688 204.352-114.176 3.552-5.792 3.04-13.184-1.216-18.496z"
                        />
                    </svg>
                    <img
                        class="cs-sun"
                        aria-hidden="true"
                        src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Icons%2Fsun.svg"
                        decoding="async"
                        alt=""
                        width="15"
                        height="15"
                    />
                </button>
            </div>
        </header>
        <!-- ============================================ -->
        <!--                    Hero                      -->
        <!-- ============================================ -->

        <section id="hero-1785">
            <div class="cs-container">
                <div class="cs-content">
                    <span class="cs-topper" data-config="tagline"></span>
                    <h1 class="cs-title" data-config="name"></h1>
                    <p class="cs-text" data-config="description"></p>
                    <div class="cs-button-group">
                        <a href="about.html" class="cs-button-solid cs-button1">Read More</a>
                    </div>
                </div>
            </div>

            <!-- Background Image -->
            <picture class="cs-background">
                <source media="(max-width: 600px)" srcset="src/assets/images/hero.jpg" />
                <source media="(min-width: 601px)" srcset="src/assets/images/hero.jpg" />
                <img
                    loading="lazy"
                    decoding="async"
                    src="src/assets/images/hero.jpg"
                    alt="field"
                    width="1920"
                    height="1200"
                    aria-hidden="true"
                />
            </picture>

            <img
                class="cs-graphic"
                src="src/assets/icons/white-splatter.svg"
                alt="graphic"
                height="161"
                width="1920"
                loading="lazy"
                decoding="async"
            />
            <!--This is a dark version. Download the image and change the fill color to match the color of the section background below it-->
            <img
                class="cs-graphic cs-graphic-dark"
                src="src/assets/icons/dark-splatter.svg"
                alt="graphic"
                height="161"
                width="1920"
                loading="lazy"
                decoding="async"
            />
        </section>
    </body>
</html>
